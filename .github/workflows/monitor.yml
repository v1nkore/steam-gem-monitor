name: steam-gem-monitor

on:
  schedule:
    # Каждые 5 минут (минимальный интервал для GitHub cron; иногда бывают задержки).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # ручной запуск из вкладки Actions

permissions:
  contents: write         # нужно, чтобы коммитить state.json обратно в репозиторий

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Persist state
        run: |
          git config user.name "gem-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state [skip ci]"
            git push
          else
            echo "no state change"
          fi
